apiVersion: apps/v1
kind: Deployment
metadata:
  name: stack-overflow-deployment
  namespace: 2401200
  labels:
    app: stack-overflow-client
    component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: stack-overflow-client
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: stack-overflow-client
        component: frontend
    spec:
      # Required to pull from your Nexus registry
      imagePullSecrets:
        - name: nexus-secret
      containers:
        - name: stack-overflow-client
          # The pipeline will replace 'client:latest' with the full Nexus URL and tag
          image: client:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              name: http
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: stack-overflow-service
  namespace: 2401200
  labels:
    app: stack-overflow-client
spec:
  type: ClusterIP
  selector:
    app: stack-overflow-client
  ports:
    - name: http
      port: 80
      targetPort: 80