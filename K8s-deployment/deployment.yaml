apiVersion: apps/v1
kind: Deployment
metadata:
  name: client
  namespace: "2401200"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: client
  template:
    metadata:
      labels:
        app: client
    spec:
      imagePullSecrets:
      - name: nexus-secret
      containers:
      - name: client
        # We keep this as 'client:latest' so your Jenkinsfile can replace it
        # with the full Nexus URL using the 'sed' command.
        image: client:latest
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: client-service
  namespace: "2401200"
spec:
  selector:
    app: client
  ports:
    - protocol: TCP
      port: 32000
      targetPort: 80
  type: NodePort
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-ingress
  namespace: "2401200"
spec:
  ingressClassName: nginx
  rules:
  - host: 2401200.imcc.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: client-service
            port:
              number: 32000